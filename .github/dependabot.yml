# The empty package-ecosystem in the generated template is invalid and fails
# every run. This project has exactly two things worth tracking: the actions
# used by CI, and the Python packages that generate test vectors.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/test/tools"
    schedule:
      interval: "weekly"
