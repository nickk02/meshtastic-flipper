name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.1.0-m0"
        required: true

permissions:
  contents: write

jobs:
  # A release that skipped its tests is worse than no release, so the builds
  # only start once the suite passes on the same commit.
  test:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the host suite
        run: bash test/host/run_tests.sh

  build:
    name: "Build .fap (${{ matrix.target }})"
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # A release should not quietly lose one firmware because that firmware's
      # SDK was briefly unavailable.
      fail-fast: false
      matrix:
        include:
          - target: ofw
            index: https://update.flipperzero.one/firmware/directory.json
          - target: unleashed
            index: https://up.unleashedflip.com/directory.json
          - target: momentum
            index: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - uses: actions/checkout@v7

      - name: Build with ufbt
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-index-url: ${{ matrix.index }}
          sdk-channel: release

      - name: Name the artifact per firmware
        run: |
          mkdir -p out
          cp dist/meshtastic.fap "out/meshtastic-${{ matrix.target }}.fap"
          echo "${{ matrix.target }}: $(stat -c%s out/meshtastic-${{ matrix.target }}.fap) bytes, API ${{ steps.build.outputs.api-version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: out/meshtastic-${{ matrix.target }}.fap
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: List what will be published
        run: ls -l release/

      # Assets must be attached while the release is still a draft.
      # This repository has immutable releases turned on, which refuses any
      # asset upload after a release is published. The action publishes first
      # and uploads second, so publishing directly produced a release with the
      # right notes and no .fap files at all.
      #
      # Building the draft and publishing it as a second step is the order the
      # API allows.
      - name: Stage the release as a draft
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*.fap
          generate_release_notes: true
          prerelease: true
          draft: true
          body: |
            One `.fap` per firmware family. Install the one matching the
            firmware on your Flipper.

            | File | Firmware |
            | --- | --- |
            | `meshtastic-ofw.fap` | Official |
            | `meshtastic-unleashed.fap` | Unleashed |
            | `meshtastic-momentum.fap` | Momentum |

            Copy it to `apps/Tools/` on the SD card. It appears under Apps,
            Tools, Meshtastic. The filename does not matter to the Flipper; the
            name shown comes from the app manifest.

            Installing the wrong one gives "App Too old" or "App too new" on
            launch. That is the loader rejecting a mismatched API version, not
            the app crashing.

            Receiving mesh traffic needs an external SX1262 module. The
            Flipper's own CC1101 cannot demodulate LoRa. Without that module
            the app still runs, and the BLE side still works, but no packets
            arrive and the radio state says so on screen.

      # Fails loudly rather than publishing an empty release. A release with
      # notes and no .fap is worse than no release, because it looks installable.
      - name: Check the draft has all three builds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          count=$(gh release view "$TAG" --json assets --jq '[.assets[].name | select(endswith(".fap"))] | length')
          echo "attached .fap count: $count"
          test "$count" -eq 3

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --draft=false --prerelease
