name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compiler version
        run: gcc --version

      - name: Run the host suite
        run: bash test/host/run_tests.sh

  vectors-reproducible:
    name: Test vectors match the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install generator dependencies
        run: python -m pip install --quiet -r test/tools/requirements.txt

      # vectors.h is committed so the tests run without Python. That only stays
      # trustworthy if the committed file still matches what the generator
      # produces, which is what this checks. It also catches anyone hand
      # editing the generated header.
      - name: Regenerate and compare
        run: |
          python test/tools/gen_vectors.py > /tmp/vectors.h
          if ! diff -u test/host/vectors.h /tmp/vectors.h; then
            echo
            echo "test/host/vectors.h does not match gen_vectors.py output."
            echo "Regenerate with: python test/tools/gen_vectors.py > test/host/vectors.h"
            exit 1
          fi
          echo "Committed vectors match the generator."

  proto-isolation:
    name: Protocol layer has no Flipper dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The whole M0 approach rests on src/proto being host-compilable. If a
      # Flipper header or an allocation creeps in, the layer stops being
      # testable on a PC and we lose the ability to isolate radio faults.
      - name: No Flipper headers
        run: |
          if grep -rnE '^[[:space:]]*#[[:space:]]*include.*(furi|gui/|input/|storage/)' src/proto/; then
            echo "src/proto must not include Flipper headers"
            exit 1
          fi
          echo "clean"

      - name: No dynamic allocation
        run: |
          if grep -rnE '\b(malloc|calloc|realloc|free)\s*\(' src/proto/; then
            echo "src/proto must not allocate; callers supply all buffers"
            exit 1
          fi
          echo "clean"

  build-fap:
    name: "Build FAP (${{ matrix.target }})"
    runs-on: ubuntu-latest
    strategy:
      # One firmware failing should not hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - target: ofw
            api: "87.1"
            index: https://update.flipperzero.one/firmware/directory.json
          - target: unleashed
            api: "88.2"
            index: https://up.unleashedflip.com/directory.json
          - target: momentum
            api: "87.1"
            index: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - uses: actions/checkout@v7

      - name: Build with ufbt
        id: build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-index-url: ${{ matrix.index }}
          sdk-channel: release

      # Each target follows its firmware's release channel, which floats. When a
      # firmware bumps its API the build follows silently, and users on that
      # firmware are then told our app is out of date. This surfaces the bump as
      # a log line instead.
      #
      # Advisory on purpose. The SDKs are not pinned, so a hard gate would turn
      # CI red on somebody else's release schedule. A warning here means "update
      # matrix.api and the README table", which is a deliberate edit.
      - name: API drift check (advisory)
        continue-on-error: true
        env:
          EXPECTED_API: ${{ matrix.api }}
          ACTUAL_API: ${{ steps.build.outputs.api-version }}
        run: |
          if [ -z "$ACTUAL_API" ]; then
            echo "::warning title=API unknown::ufbt reported no API version for ${{ matrix.target }}"
            exit 0
          fi
          if [ "$ACTUAL_API" != "$EXPECTED_API" ]; then
            echo "::warning title=API drift::${{ matrix.target }} now reports API $ACTUAL_API, but the matrix records $EXPECTED_API. Update matrix.api and the firmware table in README.md."
          else
            echo "${{ matrix.target }} API $ACTUAL_API matches the matrix."
          fi

      # Renamed per target. Three identically named meshtastic.fap files would
      # be indistinguishable once downloaded, which is how somebody installs the
      # wrong one and reports a mismatch that is not a bug.
      - name: Name the artifact per firmware
        id: rename
        run: |
          mkdir -p out
          cp dist/meshtastic.fap "out/meshtastic-${{ matrix.target }}.fap"
          echo "size=$(stat -c%s out/meshtastic-${{ matrix.target }}.fap)" >> "$GITHUB_OUTPUT"

      - name: Report size
        run: echo "meshtastic-${{ matrix.target }}.fap is ${{ steps.rename.outputs.size }} bytes, API ${{ steps.build.outputs.api-version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: meshtastic-${{ matrix.target }}
          path: out/meshtastic-${{ matrix.target }}.fap
          if-no-files-found: error

  lint-fap:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Once, against official. clang-format rules do not vary by firmware, so
      # running this three times would only spend runner minutes.
      - name: ufbt lint
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          task: lint
          sdk-channel: release
